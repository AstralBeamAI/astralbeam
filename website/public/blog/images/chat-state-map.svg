<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Make every transition visible</title><desc id="desc">A request moves through work to an outcome. Preserve the draft, show progress, and report what changed.</desc><path fill="#eef3e9" d="M0 0h720v300H0z"/><path d="M55 65v170" stroke="#a8bca0" stroke-width="2"/><g fill="#d8e5d0"><circle cx="55" cy="65" r="22"/><circle cx="55" cy="150" r="22"/><circle cx="55" cy="235" r="22"/></g><g fill="#264c3d" font-family="Arial,sans-serif"><g font-size="20" text-anchor="middle"><text x="55" y="72">1</text><text x="55" y="157">2</text><text x="55" y="242">3</text></g><g font-size="34"><text x="105" y="77">Keep the draft.</text><text x="105" y="162">Show the work.</text><text x="105" y="247">Report the outcome.</text></g></g></svg>

name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - webapp
        - www
        - sdk
        - examples
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see, and any alternatives you considered.
    validations:
      required: true

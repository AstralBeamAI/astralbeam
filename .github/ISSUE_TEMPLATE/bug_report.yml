name: Bug report
description: Report something that does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use [private reporting](https://github.com/AstralBeamAI/astralbeam/security/advisories/new) instead.

  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - webapp
        - www
        - sdk
        - examples
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Self-hosted
        - AstralBeam Cloud
        - Local development
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: SDK version, release tag, or commit SHA you are running.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, what happened instead, and any error output or logs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

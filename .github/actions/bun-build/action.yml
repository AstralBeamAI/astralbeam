name: Bun build
description: Set up Bun and install locked dependencies for every release target
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version

    - name: Install workspace dependencies
      shell: bash
      # Include native Sharp packages for the cross-compiled executables.
      # https://bun.sh/docs/pm/cli/install#platform-specific-dependencies
      run: bun install --frozen-lockfile --os=linux --os=darwin --os=win32 --cpu=x64 --cpu=arm64 --libc=glibc

name: Publish image
description: Merge and sign the staged image architecture digests
inputs:
  image:
    description: GHCR package name
    required: true
  version:
    description: Release version
    required: true
  tags:
    description: Release tags from Docker metadata
    required: true
  push:
    description: Publish release tags and signatures
    default: "false"
runs:
  using: composite
  steps:
    - name: Download both image digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: image-digest-${{ inputs.image }}-*
        merge-multiple: true
        path: ${{ runner.temp }}/${{ inputs.image }}

    - name: Validate both image digests
      shell: bash
      env:
        IMAGE_DIRECTORY: ${{ runner.temp }}/${{ inputs.image }}
      run: |
        for arch in amd64 arm64; do
          digest="$(cat "$IMAGE_DIRECTORY/$arch")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        done

    - name: Merge architecture digests and publish release tags
      if: inputs.push == 'true'
      id: merge
      shell: bash
      env:
        IMAGE_NAME: ghcr.io/astralbeamai/${{ inputs.image }}
        IMAGE_DIRECTORY: ${{ runner.temp }}/${{ inputs.image }}
        TAGS: ${{ inputs.tags }}
        VERSION: ${{ inputs.version }}
        SOURCE: ${{ github.server_url }}/${{ github.repository }}
      run: |
        args=()
        while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
        docker buildx imagetools create "${args[@]}" \
          "$IMAGE_NAME@$(cat "$IMAGE_DIRECTORY/amd64")" "$IMAGE_NAME@$(cat "$IMAGE_DIRECTORY/arm64")" \
          --annotation "index:org.opencontainers.image.version=$VERSION" \
          --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
          --annotation "index:org.opencontainers.image.source=$SOURCE" \
          --metadata-file "$IMAGE_DIRECTORY/image-metadata.json"
        digest="$(jq -er '."containerimage.digest" // ."containerimage.descriptor".digest' "$IMAGE_DIRECTORY/image-metadata.json")"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - name: Sign both architecture attestations
      if: inputs.push == 'true'
      shell: bash
      env:
        IMAGE_NAME: ghcr.io/astralbeamai/${{ inputs.image }}
        IMAGE_DIRECTORY: ${{ runner.temp }}/${{ inputs.image }}
        DIGEST: ${{ steps.merge.outputs.digest }}
      run: |
        docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST" --raw > "$IMAGE_DIRECTORY/image-index.json"
        jq -r --arg image "$IMAGE_NAME" \
          '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | "\($image)@\(.digest)"' \
          "$IMAGE_DIRECTORY/image-index.json" > "$IMAGE_DIRECTORY/attestation-digests"
        mapfile -t attestations < "$IMAGE_DIRECTORY/attestation-digests"
        test "${#attestations[@]}" -eq 2
        cosign sign --yes --oidc-provider github-actions --registry-referrers-mode oci-1-1 \
          --new-bundle-format "${attestations[@]}"

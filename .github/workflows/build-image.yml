name: Build images

on:
  workflow_call:
    inputs:
      image: { type: string, required: true }
      context: { type: string, default: "." }
      file: { type: string, default: "" }
      build-args: { type: string, default: "" }
      cache-scope: { type: string, default: "" }
      push: { type: boolean, default: false }
      cpus: { type: number, default: 2 }
      release-bundle: { type: boolean, default: false }

defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: ghcr.io/astralbeamai/${{ inputs.image }}
  DOCKER_BUILD_SUMMARY: false

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ format('blacksmith-{0}vcpu-ubuntu-2404{1}', inputs.cpus, matrix.arch == 'arm64' && '-arm' || '') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the image version
        id: version
        run: echo "version=$(jq -r .version sdk/package.json)" >> "$GITHUB_OUTPUT"

      - name: Restore the release bundle
        id: release-bundle
        if: inputs.release-bundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            sdk/dist
            platform/.output/server
            platform/.output/public
            platform/.output/sourcemaps
            platform/public/api/openapi.json
            platform/packages/sandbox/dist
            platform-binaries/astralbeam-platform-linux-x86_64
            platform-binaries/astralbeam-platform-linux-arm64
          key: release-bundle-Linux-X64-${{ github.sha }}

      - name: Restore persistent Docker layers
        uses: useblacksmith/stickydisk@58353272695835d240e918fd2a15b3900d340753
        env:
          BLACKSMITH_METRICS_HTTP_PORT: ""
        with:
          key: github-builder-${{ inputs.cache-scope || inputs.file || inputs.context }}-linux/${{ matrix.arch }}
          path: /mnt/github-builder-cache

      - name: Attach persistent BuildKit state
        run: docker volume create --driver local --opt type=none --opt device=/mnt/github-builder-cache --opt o=bind buildx_buildkit_github-builder0_state

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: github-builder
          keep-state: true
          version: v0.38.0
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Prepare the cached native image binary
        if: steps.release-bundle.outputs.cache-hit == 'true'
        env:
          BINARY: astralbeam-platform-linux-${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-image/app/platform/.output"
          cp "platform-binaries/$BINARY" "$RUNNER_TEMP/release-image/app/platform/.output/astralbeam-platform"
          cp LICENSE-MIT "$RUNNER_TEMP/release-image/app/"

      - name: Log in to GHCR for digest staging
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build the image without release tags
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}:${{ inputs.context }}
          file: ${{ inputs.file }}
          # The same-SHA CI binary replaces Docker's build stage, retaining its runtime stage.
          # https://docs.docker.com/reference/cli/docker/buildx/build/#build-context
          build-contexts: ${{ steps.release-bundle.outputs.cache-hit == 'true' && format('build={0}/release-image', runner.temp) || '' }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILDKIT_MULTI_PLATFORM=1
            ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},oci-artifact=true,push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          provenance: mode=max,version=v1
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

      - name: Record the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/${{ matrix.arch }}"

      - name: Upload the image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}
          if-no-files-found: error

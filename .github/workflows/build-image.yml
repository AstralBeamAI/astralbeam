name: Build and publish images

on:
  workflow_call:
    inputs:
      phase: { type: string, required: true }
      image: { type: string, required: true }
      version: { type: string, required: true }
      context: { type: string, default: "." }
      file: { type: string, default: "" }
      build-args: { type: string, default: "" }
      cache-scope: { type: string, default: "" }
      push: { type: boolean, default: false }
      latest: { type: boolean, default: false }
      cpus: { type: number, default: 2 }

defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: ghcr.io/astralbeamai/${{ inputs.image }}
  DOCKER_BUILD_SUMMARY: false

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    if: inputs.phase == 'build'
    runs-on: ${{ format('blacksmith-{0}vcpu-ubuntu-2404{1}', inputs.cpus, matrix.arch == 'arm64' && '-arm' || '') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Restore persistent Docker layers
        uses: useblacksmith/stickydisk@58353272695835d240e918fd2a15b3900d340753
        env:
          BLACKSMITH_METRICS_HTTP_PORT: ""
        with:
          key: github-builder-${{ inputs.cache-scope || inputs.file || inputs.context }}-linux/${{ matrix.arch }}
          path: /mnt/github-builder-cache

      - name: Attach persistent BuildKit state
        run: docker volume create --driver local --opt type=none --opt device=/mnt/github-builder-cache --opt o=bind buildx_buildkit_github-builder0_state

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: github-builder
          keep-state: true
          version: v0.38.0
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Log in to GHCR for digest staging
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build the image without release tags
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}:${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILDKIT_MULTI_PLATFORM=1
            ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},oci-artifact=true,push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          provenance: mode=max,version=v1
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          secret-envs: GIT_AUTH_TOKEN=GIT_AUTH_TOKEN
        env:
          GIT_AUTH_TOKEN: ${{ github.token }}

      - name: Record the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p "$RUNNER_TEMP/image-digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/image-digest/${{ matrix.arch }}"

      - name: Upload the image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digest/${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish the verified image
    if: inputs.phase == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/build-image.yml@${{ github.ref }}
      COSIGN_EXPERIMENTAL: "1"
    steps:
      - name: Download both image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-${{ inputs.image }}-*
          merge-multiple: true
          path: digests

      - name: Validate both image digests
        run: |
          for arch in amd64 arm64; do
            digest="$(cat "digests/$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done

      - name: Generate release tag metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Set up Docker Buildx for manifest commands
        if: inputs.push
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver: docker

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Merge architecture digests and publish release tags
        if: inputs.push
        id: merge
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "digests/$arch")"
            sources+=("$IMAGE_NAME@$digest")
          done
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${sources[@]}" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --metadata-file "$RUNNER_TEMP/image-metadata.json"
          digest="$(jq -er '."containerimage.digest" // ."containerimage.descriptor".digest' "$RUNNER_TEMP/image-metadata.json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and verify both architecture attestations
        if: inputs.push
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST" --raw > "$RUNNER_TEMP/image-index.json"
          jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' \
            "$RUNNER_TEMP/image-index.json" > "$RUNNER_TEMP/attestation-digests"
          test "$(wc -l < "$RUNNER_TEMP/attestation-digests")" -eq 2
          while IFS= read -r digest; do
            cosign sign --yes --oidc-provider github-actions --registry-referrers-mode oci-1-1 \
              --new-bundle-format "$IMAGE_NAME@$digest"
            cosign verify --experimental-oci11 --new-bundle-format \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_NAME@$digest"
          done < "$RUNNER_TEMP/attestation-digests"

      - name: Remove redundant build indexes
        if: inputs.push
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          package: ${{ inputs.image }}
          delete-untagged: true
          validate: true

      - name: Verify both architectures and signatures after cleanup
        if: inputs.push
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST" \
            --format '{{json .Image}}' | jq -e 'keys == ["linux/amd64", "linux/arm64"]'
          while IFS= read -r digest; do
            cosign verify --experimental-oci11 --new-bundle-format \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_NAME@$digest"
          done < "$RUNNER_TEMP/attestation-digests"

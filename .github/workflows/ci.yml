name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every project reports its own result, so one failing leg does not hide the others.
      fail-fast: false
      matrix:
        project: [webapp, www, sdk, cli, examples/todos]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          # setup-deno names the latest stable channel "latest". https://github.com/denoland/setup-deno#version-from-input
          deno-version: latest
          # Caches the module cache, keyed by a hash of the per-project deno.lock files.
          cache: true

      - name: Check root formatting
        run: deno task format:check

      - name: Cache SDK node_modules
        if: matrix.project == 'examples/todos' || matrix.project == 'webapp' || matrix.project == 'cli'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: sdk/node_modules
          key: node_modules-${{ runner.os }}-sdk-${{ hashFiles('sdk/deno.lock') }}

      - name: Build the SDK
        if: matrix.project == 'examples/todos' || matrix.project == 'webapp' || matrix.project == 'cli'
        # The webapp, CLI, and example consume `sdk/dist` through file dependencies, so their
        # typecheck and build cannot run before the SDK is installed and built.
        working-directory: sdk
        run: |
          deno install --frozen
          deno task build

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ matrix.project }}/node_modules
          key: node_modules-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles(format('{0}/deno.lock', matrix.project)) }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        env:
          # Keep sharp on its lockfile-pinned binary instead of compiling against a host-installed libvips. https://sharp.pixelplumbing.com/install#custom-libvips
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: deno install --frozen

      - name: Prepare Webapp test database
        if: matrix.project == 'webapp'
        working-directory: webapp
        env:
          DATABASE_URL: postgres://astralbeam:astralbeam123@127.0.0.1:5432/ci_dogfood_test
        run: |
          docker compose up --detach --wait postgres pgbouncer
          docker compose exec -T postgres createdb -U astralbeam ci_dogfood_test
          deno task db migrate

      - name: Check, test, and build
        working-directory: ${{ matrix.project }}
        env:
          DATABASE_URL: ${{ matrix.project == 'webapp' && 'postgres://astralbeam:astralbeam123@127.0.0.1:5432/ci_dogfood_test' || '' }}
        # `binary:check` builds before compiling and smoke-testing, so it replaces the `build` in `ready`.
        run: deno task ${{ (matrix.project == 'webapp' || matrix.project == 'cli') && 'check && deno task test && deno task binary:check' || 'ready' }}

  todos-rails:
    name: Check examples/todos-rails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/todos-rails
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          # Reads .ruby-version there and caches the bundle. https://github.com/ruby/setup-ruby#caching-bundle-install-automatically
          working-directory: examples/todos-rails
          bundler-cache: true

      - name: Lint, audit, and test
        # Rails' own local CI runner: RuboCop, bundler-audit, importmap audit, Brakeman, and tests.
        run: bin/ci

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: latest
          cache: true

      - name: Cache Webapp node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: webapp/node_modules
          key: node_modules-${{ runner.os }}-webapp-${{ hashFiles('webapp/deno.lock') }}

      - name: Cache SDK node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: sdk/node_modules
          key: node_modules-${{ runner.os }}-sdk-${{ hashFiles('sdk/deno.lock') }}

      - name: Cache todos example node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: examples/todos/node_modules
          key: node_modules-${{ runner.os }}-examples/todos-${{ hashFiles('examples/todos/deno.lock') }}

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: |
          (cd webapp && deno install --frozen)
          (cd sdk && deno install --frozen)
          (cd examples/todos && deno install --frozen)

      - name: Build the SDK
        working-directory: sdk
        run: deno task build

      - name: Start test dependencies
        # --wait blocks until PostgreSQL, PgBouncer, Valkey, and Mailpit are healthy.
        run: docker compose up --detach --wait

      - name: Migrate and seed the database
        working-directory: webapp
        run: |
          deno task db migrate
          deno task db-seed

      - name: Install Chromium
        working-directory: examples/todos
        run: deno task e2e:install

      - name: Run deterministic browser specs
        working-directory: examples/todos
        # Only the `app` project, which never calls a model; the suite starts its own webapp and
        # todos servers. https://playwright.dev/docs/test-webserver
        run: deno task e2e --project=app

name: Push CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # Caches the module cache, keyed by a hash of the per-application deno.lock files.
          cache: true

      - name: Set up workspace
        # The shared setup script provisions system packages and runs the frozen install for every application.
        run: |
          ./scripts/setup.sh

      - name: Start test dependencies
        # --wait blocks until services are healthy
        run: docker compose up --detach --wait

      - name: Check and test webapp
        working-directory: webapp
        run: |
          deno task check
          deno task test
          deno task build

      - name: Check and test website
        working-directory: www
        run: |
          deno task check
          deno task test
          deno task build

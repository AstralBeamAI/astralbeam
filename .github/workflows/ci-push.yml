name: Push CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # setup-deno names the latest stable channel "latest". https://github.com/denoland/setup-deno#version-from-input
          deno-version: latest
          # Caches the module cache, keyed by a hash of the per-application deno.lock files.
          cache: true

      - name: Set up workspace
        # The shared setup script provisions system packages and runs the frozen install for every application.
        run: |
          ./scripts/setup.sh

      - name: Start test dependencies
        # --wait blocks until services are healthy
        run: docker compose up --detach --wait

      - name: Auto-fix project issues
        run: |
          deno task --cwd webapp knip:fix
          deno task --cwd webapp check:fix
          deno task --cwd www knip:fix
          deno task --cwd www check:fix

      - name: Check, test, and build projects
        run: |
          deno task --cwd webapp ready
          deno task --cwd www ready
          deno task --cwd sdk ready
          deno task --cwd examples/todos ready

      - name: Commit and push auto-fixes
        uses: ./.github/actions/commit-and-push
        with:
          commit-message: "chore: apply CI auto-fixes"
          app-client-id: ${{ vars.AUTOFIX_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

name: Sandbox image

on:
  pull_request:
    paths: ["platform/packages/sandbox/image/**", ".github/workflows/sandbox.yml"]
  push:
    paths: ["platform/packages/sandbox/image/**", ".github/workflows/sandbox.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency: sandbox-image-${{ github.ref }}

jobs:
  image:
    name: Build and publish
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1
    with:
      output: image
      push: ${{ github.repository == 'AstralBeamAI/astralbeam' && github.event_name != 'pull_request' }}
      context: platform/packages/sandbox/image
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/astralbeamai/sandbox
      meta-tags: |
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
      sbom: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

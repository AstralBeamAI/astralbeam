name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify everything without publishing images, creating the release, or staging npm packages
        type: boolean
        default: false
      minimal:
        description: Skip verification, source maps, smoke tests, and Intel macOS and Windows binaries, and stage the SDK and CLI and release in one job. Dry runs use the full verification path.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize publishing and cleanup across releases from different refs.
  group: ${{ github.workflow }}${{ inputs.dry-run && format('-dry-run-{0}', github.ref) || '' }}

jobs:
  verify:
    name: Verify version
    if: ${{ !inputs.minimal || inputs.dry-run }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the tag matches the SDK, CLI, and Platform versions
        id: version
        # `sdk`, `cli`, and `platform` are the versioned projects and move in lockstep: examples/todos
        # declares no version and website is a private placeholder at 0.0.0.
        run: |
          version="$(jq -r .version sdk/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for project in cli platform; do
            if [ "$(jq -r .version "$project/package.json")" != "$version" ]; then
              echo "::error::$project/package.json must match sdk/package.json version ${version}"
              exit 1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match sdk/package.json version ${version}"
            exit 1
          fi

      - name: Verify publishing target
        if: ${{ !inputs.dry-run }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag="refs/tags/v$RELEASE_VERSION"
          if git show-ref --verify --quiet "$tag"; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::v$RELEASE_VERSION already points to a different commit. Choose a new version or run Release from that tag."
              exit 1
            fi
            exit 0
          fi
          # GITHUB_TOKEN cannot publish workflow changes. https://docs.github.com/en/rest/releases/releases#create-a-release
          changes="$(git diff --name-only --no-renames --diff-filter=AM "origin/$DEFAULT_BRANCH" "$GITHUB_SHA" -- .github/workflows)"
          if [ -n "$changes" ]; then
            echo "::error::GITHUB_TOKEN cannot release this commit because it changes .github/workflows relative to $DEFAULT_BRANCH. Merge those workflow changes into $DEFAULT_BRANCH before publishing."
            exit 1
          fi

  build:
    name: Build release artifacts
    if: ${{ !inputs.minimal || inputs.dry-run }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      # Version-free names let `releases/latest/download/<asset>` always serve the newest binary.
      # https://docs.github.com/repositories/releasing-projects-on-github/linking-to-releases
      PLATFORM_ASSET_PREFIX: astralbeam-platform
      CLI_ASSET_PREFIX: astralbeam
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies for every release target
        # Include native Sharp packages for the cross-compiled executables.
        # https://bun.sh/docs/pm/cli/install#platform-specific-dependencies
        run: bun install --frozen-lockfile --os=linux --os=darwin --os=win32 --cpu=x64 --cpu=arm64 --libc=glibc

      - name: Cache release bundle
        id: release-bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            sdk/dist
            platform/.output/server
            platform/.output/public
            platform/.output/sourcemaps
            platform/public/api/openapi.json
            platform/packages/sandbox/dist
            platform-binaries/astralbeam-platform-linux-x86_64
            platform-binaries/astralbeam-platform-linux-arm64
          key: release-bundle-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Build the SDK
        if: steps.release-bundle.outputs.cache-hit != 'true'
        working-directory: sdk
        run: bun run build

      - name: Build the Platform
        # A cached bundle still needs the host executable and all binary smoke tests.
        working-directory: platform
        env:
          RELEASE_BUNDLE_CACHED: ${{ steps.release-bundle.outputs.cache-hit }}
        run: |
          if [ "$RELEASE_BUNDLE_CACHED" = true ]; then bun run compile; else bun run build; fi

      - name: Upload the Platform source maps to PostHog
        if: ${{ !inputs.dry-run && vars.POSTHOG_PROJECT_ID != '' }}
        background: true
        working-directory: platform
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_HOST || 'https://us.posthog.com' }}
        run: bun run sourcemaps:posthog --directory .output/sourcemaps

      - parallel:
          - name: Smoke-test the Platform binary
            working-directory: platform
            run: bun run binary:check

          - name: Cross-compile the other Platform binaries
            working-directory: platform
            shell: bash
            run: |
              mkdir -p ../platform-binaries
              cp .output/astralbeam-platform "../platform-binaries/${PLATFORM_ASSET_PREFIX}-linux-x86_64"
              for pair in bun-linux-arm64:linux-arm64 bun-darwin-x64:macos-x86_64 \
                bun-darwin-arm64:macos-arm64 bun-windows-x64:windows-x86_64.exe; do
                bun run compile --target "${pair%%:*}" \
                  --outfile "../platform-binaries/${PLATFORM_ASSET_PREFIX}-${pair#*:}"
              done

          - name: Build, compile, and smoke-test the CLI binaries
            working-directory: cli
            shell: bash
            run: |
              RELEASE_VERSION="$(jq -r .version ../sdk/package.json)"
              bun run build
              test "$(bun dist/astralbeam.js --version)" = "$RELEASE_VERSION"
              mkdir ../cli-binaries
              for pair in bun-linux-x64:linux-x86_64 bun-linux-arm64:linux-arm64 \
                bun-darwin-x64:macos-x86_64 bun-darwin-arm64:macos-arm64 \
                bun-windows-x64:windows-x86_64.exe; do
                bun build --compile --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
                  --asset dist/skills --target "${pair%%:*}" --outfile "../cli-binaries/${CLI_ASSET_PREFIX}-${pair#*:}" dist/astralbeam.js
              done
              binary="../cli-binaries/${CLI_ASSET_PREFIX}-linux-x86_64"
              test "$("$binary" --version)" = "$RELEASE_VERSION"
              "$binary" skill | grep -q '^name: astralbeam$'

      - name: Compress the release binaries
        shell: bash
        run: |
          files=()
          for suffix in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64 windows-x86_64.exe; do
            files+=("cli-binaries/${CLI_ASSET_PREFIX}-$suffix" "platform-binaries/${PLATFORM_ASSET_PREFIX}-$suffix")
          done
          tar -cf - "${files[@]}" | zstd -T0 -3 --long=30 -o binaries.tar.zst

      - name: Upload the release binaries
        background: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: binaries.tar.zst
          if-no-files-found: error

      - name: Pack the SDK and CLI without publishing credentials
        run: |
          mkdir npm-packages
          for project in sdk cli; do
            bun pm --cwd "$project" pack --filename "$GITHUB_WORKSPACE/npm-packages/$project.tgz"
          done

      - name: Upload the SDK and CLI packages
        background: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error

      - wait-all:

  github-release:
    name: Finalize the release
    needs: [verify, build, docker-image, sandbox-image]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && needs.build.result == 'success'
        && needs.docker-image.result == 'success'
        && needs.sandbox-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      COSIGN_EXPERIMENTAL: "1"
      CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the release binaries
        background: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries.tar.zst
          skip-decompress: true

      - parallel:
          - name: Download the npm packages
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: npm-packages
              path: npm-packages

          - name: Set up Node
            uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
            with:
              node-version: "24"
              check-latest: true
              registry-url: https://registry.npmjs.org
              package-manager-cache: false

          - name: Set up Docker Buildx for manifest commands
            uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            with:
              version: v0.38.0
              driver: docker

          - name: Log in to GHCR
            uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ github.token }}

          - name: Install Cosign
            uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
            with:
              cosign-release: v3.1.3

          # Keep shared actions here until parallel composite action downloads no longer race.
          # https://github.com/AstralBeamAI/astralbeam/actions/runs/42314060385
          - name: Generate Platform image tags
            id: platform-meta
            uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
            with:
              images: ghcr.io/astralbeamai/astralbeam-platform
              tags: type=raw,value=${{ needs.verify.outputs.version }}

          - name: Generate sandbox image tags
            id: sandbox-meta
            uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
            with:
              images: ghcr.io/astralbeamai/sandbox
              tags: |
                type=raw,value=${{ needs.verify.outputs.version }}
                type=raw,value=latest

      - name: Publish the Docker image
        id: platform-publish
        background: true
        uses: ./.github/actions/publish-image
        with:
          image: astralbeam-platform
          tags: ${{ steps.platform-meta.outputs.tags }}
          version: ${{ needs.verify.outputs.version }}
          push: ${{ !inputs.dry-run }}

      - name: Publish the sandbox image
        id: sandbox-publish
        background: true
        uses: ./.github/actions/publish-image
        with:
          image: sandbox
          tags: ${{ steps.sandbox-meta.outputs.tags }}
          version: ${{ needs.verify.outputs.version }}
          push: ${{ !inputs.dry-run }}

      - name: Stage the SDK and CLI
        background: true
        if: ${{ !inputs.dry-run }}
        # Staging never makes a package public, so no token or 2FA is needed here. A maintainer
        # approves each with 2FA afterwards. https://docs.npmjs.com/cli/v11/commands/npm-stage
        shell: bash
        run: |
          set -o pipefail
          for project in sdk cli; do
            npm stage publish --ignore-scripts "./npm-packages/$project.tgz" | tee -a "$RUNNER_TEMP/npm-stage.log"
          done
          {
            echo "## SDK and CLI staged on npm"
            echo
            echo "Approve each with \`npm stage approve <stage-id>\` or from the Staged Packages tab of [@astralbeam/sdk](https://www.npmjs.com/package/@astralbeam/sdk) and [@astralbeam/cli](https://www.npmjs.com/package/@astralbeam/cli). Approval prompts for 2FA."
            echo
            echo '```'
            cat "$RUNNER_TEMP/npm-stage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - wait: [platform-publish, sandbox-publish]

      - parallel:
          - name: Remove redundant Platform build indexes
            if: ${{ !inputs.dry-run }}
            uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
            with:
              token: ${{ github.token }}
              package: astralbeam-platform
              delete-untagged: true
              validate: true

          - name: Remove redundant sandbox build indexes
            if: ${{ !inputs.dry-run }}
            uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
            with:
              token: ${{ github.token }}
              package: sandbox
              delete-untagged: true
              validate: true

      - parallel:
          - name: Verify the Platform image after cleanup
            if: ${{ !inputs.dry-run }}
            uses: ./.github/actions/verify-image
            with:
              image: astralbeam-platform

          - name: Verify the sandbox image after cleanup
            if: ${{ !inputs.dry-run }}
            uses: ./.github/actions/verify-image
            with:
              image: sandbox

      - wait-all:

      - name: Extract the release binaries
        shell: bash
        run: zstd -dc --long=30 binaries.tar.zst | tar -xf - --strip-components=1

      - name: Generate release checksums
        run: sha256sum astralbeam-* > SHA256SUMS

      - name: Create the release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        # The glob matches both the platform and the CLI binaries downloaded above.
        run: |
          tag="v$RELEASE_VERSION"
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')"
          if ! grep -Fxq "refs/tags/$tag" <<< "$refs"; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          tag_sha="$(gh api "repos/$GH_REPO/commits/refs/tags/$tag" --jq .sha)"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$tag now points to a different commit. Refusing to release artifacts from $GITHUB_SHA."
            exit 1
          fi
          gh release create "$tag" --verify-tag --latest --generate-notes astralbeam-* SHA256SUMS

  docker-image:
    name: Build the Docker image
    if: ${{ !inputs.minimal || inputs.dry-run }}
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      cpus: 8
      image: astralbeam-platform
      release-bundle: true
      push: ${{ !inputs.dry-run }}
      file: platform/Dockerfile
      build-args: SOURCE_VERSION=${{ github.sha }}

  sandbox-image:
    name: Build the sandbox image
    if: ${{ !inputs.minimal || inputs.dry-run }}
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: sandbox
      push: ${{ !inputs.dry-run }}
      context: platform/packages/sandbox/image
      cache-scope: sandbox

  minimal-release:
    name: Stage the SDK and CLI and release binaries (minimal)
    if: ${{ inputs.minimal && !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One job skips artifact transfers, so build code shares the npm and release credentials.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies for the Linux and Apple Silicon targets
        run: bun install --frozen-lockfile --os=linux --os=darwin --cpu=x64 --cpu=arm64 --libc=glibc

      - name: Build the SDK
        # Skips the build task's `pack --dry-run`, since the next step packs it for real.
        run: |
          bun run --cwd sdk generate:styles
          bun run --cwd sdk tsdown

      - name: Build the CLI and compile the Linux and Apple Silicon binaries
        working-directory: cli
        shell: bash
        run: |
          bun run build
          mkdir ../cli-binaries
          for pair in bun-linux-x64:linux-x86_64 bun-linux-arm64:linux-arm64 bun-darwin-arm64:macos-arm64; do
            bun build --compile --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
              --asset dist/skills --target "${pair%%:*}" --outfile "../cli-binaries/astralbeam-${pair#*:}" dist/astralbeam.js
          done

      - name: Stage the SDK and CLI
        background: true
        shell: bash
        run: |
          for project in sdk cli; do
            bun pm --cwd "$project" pack --filename "$RUNNER_TEMP/$project.tgz"
            npm stage publish --ignore-scripts "$RUNNER_TEMP/$project.tgz" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # Minimal releases ship no Intel macOS or Windows binaries. Full releases still build them.
      - name: Build the Platform binaries
        shell: bash
        run: |
          bun run --cwd platform build
          mkdir platform-binaries
          mv platform/.output/astralbeam-platform platform-binaries/astralbeam-platform-linux-x86_64
          for pair in bun-linux-arm64:linux-arm64 bun-darwin-arm64:macos-arm64; do
            bun run --cwd platform compile --target "${pair%%:*}" \
              --outfile "$GITHUB_WORKSPACE/platform-binaries/astralbeam-platform-${pair#*:}"
          done
          mv cli-binaries/astralbeam-* platform-binaries/
          (cd platform-binaries && sha256sum astralbeam-* > SHA256SUMS)

      - wait-all:

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version platform/package.json)"
          cd platform-binaries
          gh release create "v$version" --target "$GITHUB_SHA" --latest --generate-notes astralbeam-* SHA256SUMS

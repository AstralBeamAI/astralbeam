name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify everything without publishing images, creating the release, or staging npm packages
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Publishing and cleanup share one registry package, including releases from different refs.
  group: ${{ github.workflow }}

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the tag matches the SDK, CLI, and Platform versions
        id: version
        # `sdk`, `cli`, and `platform` are the versioned projects and move in lockstep: examples/todos
        # declares no version and website is a private placeholder at 0.0.0.
        run: |
          version="$(jq -r .version sdk/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for project in cli platform; do
            if [ "$(jq -r .version "$project/package.json")" != "$version" ]; then
              echo "::error::$project/package.json must match sdk/package.json version ${version}"
              exit 1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match sdk/package.json version ${version}"
            exit 1
          fi

      - name: Verify publishing target
        if: ${{ !inputs.dry-run }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag="refs/tags/v$RELEASE_VERSION"
          if git show-ref --verify --quiet "$tag"; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::v$RELEASE_VERSION already points to a different commit. Choose a new version or run Release from that tag."
              exit 1
            fi
            exit 0
          fi
          # GITHUB_TOKEN cannot publish workflow changes. https://docs.github.com/en/rest/releases/releases#create-a-release
          changes="$(git diff --name-only --no-renames --diff-filter=AM "origin/$DEFAULT_BRANCH" "$GITHUB_SHA" -- .github/workflows)"
          if [ -n "$changes" ]; then
            echo "::error::GITHUB_TOKEN cannot release this commit because it changes .github/workflows relative to $DEFAULT_BRANCH. Merge those workflow changes into $DEFAULT_BRANCH before publishing."
            exit 1
          fi

  build:
    name: Build release artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Version-free names let `releases/latest/download/<asset>` always serve the newest binary.
      # https://docs.github.com/repositories/releasing-projects-on-github/linking-to-releases
      PLATFORM_ASSET_PREFIX: astralbeam-platform
      CLI_ASSET_PREFIX: astralbeam
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies for every release target
        # Include native Sharp packages for the cross-compiled executables.
        # https://bun.sh/docs/pm/cli/install#platform-specific-dependencies
        run: bun install --frozen-lockfile --os=linux --os=darwin --os=win32 --cpu=x64 --cpu=arm64 --libc=glibc

      - name: Build the SDK
        working-directory: sdk
        run: bun run build

      - name: Build the Platform
        # Builds `.output` once and compiles the host binary from it.
        working-directory: platform
        run: bun run build

      - name: Smoke-test the Platform binary
        working-directory: platform
        run: bun run binary:check

      - name: Cross-compile the other Platform binaries
        working-directory: platform
        shell: bash
        run: |
          mkdir ../platform-binaries
          mv .output/astralbeam-platform "../platform-binaries/${PLATFORM_ASSET_PREFIX}-linux-x86_64"
          for pair in bun-linux-arm64:linux-arm64 bun-darwin-x64:macos-x86_64 \
            bun-darwin-arm64:macos-arm64 bun-windows-x64:windows-x86_64.exe; do
            bun run compile --target "${pair%%:*}" \
              --outfile "../platform-binaries/${PLATFORM_ASSET_PREFIX}-${pair#*:}"
          done

      - name: Build the CLI
        working-directory: cli
        run: bun run build

      - name: Compile and smoke-test the CLI binaries
        # Bun cross-compiles the same bundled npm entry for every release target.
        # https://bun.sh/docs/bundler/executables
        working-directory: cli
        shell: bash
        run: |
          test "$(bun dist/astralbeam.js --version)" = "$RELEASE_VERSION"
          mkdir ../cli-binaries
          for pair in bun-linux-x64:linux-x86_64 bun-linux-arm64:linux-arm64 \
            bun-darwin-x64:macos-x86_64 bun-darwin-arm64:macos-arm64 \
            bun-windows-x64:windows-x86_64.exe; do
            bun build --compile --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
              --asset dist/skills --target "${pair%%:*}" --outfile "../cli-binaries/${CLI_ASSET_PREFIX}-${pair#*:}" dist/astralbeam.js
          done
          binary="../cli-binaries/${CLI_ASSET_PREFIX}-linux-x86_64"
          test "$("$binary" --version)" = "$RELEASE_VERSION"
          "$binary" skill | grep -q '^name: astralbeam$'

      - name: Upload the CLI binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries
          path: cli-binaries
          if-no-files-found: error

      - name: Pack the SDK and CLI without publishing credentials
        run: |
          mkdir npm-packages
          for project in sdk cli; do
            bun pm --cwd "$project" pack --filename "$GITHUB_WORKSPACE/npm-packages/$project.tgz"
          done

      - name: Upload the CLI package output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error

      - name: Upload the Platform binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-binaries
          path: platform-binaries
          if-no-files-found: error

  github-release:
    name: Create the GitHub release
    # Runs after staging so a failed npm step does not leave a release pointing at unstaged packages.
    needs: [verify, build, stage-npm, docker-image, docker-cleanup]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the Platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-binaries

      - name: Download the CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        # The glob matches both the platform and the CLI binaries downloaded above.
        run: |
          sha256sum astralbeam-* > SHA256SUMS
          tag="v$RELEASE_VERSION"
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')"
          if ! grep -Fxq "refs/tags/$tag" <<< "$refs"; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          tag_sha="$(gh api "repos/$GH_REPO/commits/refs/tags/$tag" --jq .sha)"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$tag now points to a different commit. Refusing to release artifacts from $GITHUB_SHA."
            exit 1
          fi
          gh release create "$tag" --verify-tag --latest --generate-notes astralbeam-* SHA256SUMS

  docker-image:
    name: Build and publish the Docker image
    needs: [verify, build, stage-npm]
    if: ${{ !cancelled() && needs.build.result == 'success' && (inputs.dry-run || needs.stage-npm.result == 'success') }}
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ !inputs.dry-run }}
      file: platform/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ghcr.io/astralbeamai/astralbeam-platform
      meta-tags: type=raw,value=${{ needs.verify.outputs.version }}
      labels: |
        org.opencontainers.image.version=${{ needs.verify.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
      sbom: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  docker-cleanup:
    name: Remove redundant Docker build indexes
    needs: docker-image
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_DIGEST: ${{ needs.docker-image.outputs.digest }}
      VERIFY_COMMANDS: ${{ needs.docker-image.outputs.cosign-verify-commands }}
    steps:
      - name: Install the builder's Cosign version
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ needs.docker-image.outputs.cosign-version }}

      - name: Verify signatures before cleanup
        env:
          IMAGE_SIGNED: ${{ needs.docker-image.outputs.signed }}
        # Use the verification commands emitted by the pinned Docker builder.
        # https://github.com/docker/github-builder/blob/4345a1cea1e4cfb65c8a5e2b1b80f9e630068827/.github/workflows/build.yml#L181
        run: |
          test "$IMAGE_SIGNED" = true
          test -n "$VERIFY_COMMANDS"
          bash -euo pipefail -c "$VERIFY_COMMANDS"

      - name: Remove unreferenced build indexes
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          package: astralbeam-platform
          delete-untagged: true
          validate: true

      - name: Verify both architectures and signatures after cleanup
        shell: bash
        # The cleanup action's validation only warns, so make missing manifests or signatures fatal.
        run: |
          docker buildx imagetools inspect "ghcr.io/astralbeamai/astralbeam-platform@$IMAGE_DIGEST" \
            --format '{{json .Image}}' | jq -e 'keys == ["linux/amd64", "linux/arm64"]'
          bash -euo pipefail -c "$VERIFY_COMMANDS"

  stage-npm:
    name: Stage the SDK and CLI on npm
    needs: [verify, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Trusted publishing exchanges this OIDC token for a short-lived npm credential. https://docs.npmjs.com/trusted-publishers
      id-token: write
    steps:
      - name: Download the npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: npm-packages

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Stage the SDK and CLI
        # Staging never makes a package public, so no token or 2FA is needed here. A maintainer
        # approves each with 2FA afterwards. https://docs.npmjs.com/cli/v11/commands/npm-stage
        shell: bash
        run: |
          set -o pipefail
          for project in sdk cli; do
            npm stage publish --ignore-scripts "./npm-packages/$project.tgz" | tee -a "$RUNNER_TEMP/npm-stage.log"
          done

      - name: Report the staged packages
        run: |
          {
            echo "## SDK and CLI staged on npm"
            echo
            echo "Approve each with \`npm stage approve <stage-id>\` or from the Staged Packages tab of [@astralbeam/sdk](https://www.npmjs.com/package/@astralbeam/sdk) and [@astralbeam/cli](https://www.npmjs.com/package/@astralbeam/cli). Approval prompts for 2FA."
            echo
            echo '```'
            cat "$RUNNER_TEMP/npm-stage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

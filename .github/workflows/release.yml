name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify everything without creating the release or staging the SDK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # A tag push carries no inputs, so an absent `dry-run` means a real release.
  DRY_RUN: ${{ inputs.dry-run || false }}

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify the tag matches the SDK and CLI versions
        id: version
        # `sdk` and `cli` are the versioned projects and move in lockstep: webapp and examples/todos
        # declare no version and www is a private placeholder at 0.0.0.
        run: |
          version="$(jq -r .version sdk/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .version cli/package.json)" != "$version" ]; then
            echo "::error::cli/package.json must match sdk/package.json version ${version}"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::notice::Dry run on ${GITHUB_REF_NAME}, sdk/package.json is at ${version}"
              exit 0
            fi
            echo "::error::A release must run from a v* tag, but this run is on ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match sdk/package.json version ${version}"
            exit 1
          fi

  build:
    name: Build release artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLATFORM_ASSET_PREFIX: astralbeam-platform-v${{ needs.verify.outputs.version }}
      CLI_ASSET_PREFIX: astralbeam-v${{ needs.verify.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: latest
          cache: true

      - name: Install SDK dependencies
        working-directory: sdk
        run: deno install --frozen

      - name: Build the SDK
        working-directory: sdk
        run: deno task build

      - name: Install Webapp dependencies
        working-directory: webapp
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: deno install --frozen

      - name: Build the Webapp
        # `deno task compile` embeds `.output`, so the Vite and Nitro build has to run first.
        working-directory: webapp
        run: deno task build

      - name: Compile and smoke-test the Webapp binary
        working-directory: webapp
        run: deno task binary:check

      - name: Cross-compile the other Webapp binaries
        # Ships the smoke-tested host binary as linux-x86_64 and repeats the `compile` task's flags
        # for the other targets. https://docs.deno.com/runtime/reference/cli/compile/
        working-directory: webapp
        shell: bash
        run: |
          mkdir ../platform-binaries
          mv .output/astralbeam-platform "../platform-binaries/${PLATFORM_ASSET_PREFIX}-linux-x86_64"
          for pair in aarch64-unknown-linux-gnu:linux-arm64 x86_64-apple-darwin:macos-x86_64 \
            aarch64-apple-darwin:macos-arm64 x86_64-pc-windows-msvc:windows-x86_64.exe; do
            deno compile --no-check --node-modules-dir=none --exclude-unused-npm --include npm:busboy \
              --config deno.jsonc -P=runtime --target "${pair%%:*}" \
              --output "../platform-binaries/${PLATFORM_ASSET_PREFIX}-${pair#*:}" .
          done

      - name: Install CLI dependencies
        working-directory: cli
        run: deno install --frozen

      - name: Build the CLI
        working-directory: cli
        run: deno task build

      - name: Compile and smoke-test the CLI binaries
        # deno compile cross-compiles from one runner, and the experimental QuickJS engine makes each
        # binary 40-46% smaller than V8. https://docs.deno.com/runtime/reference/cli/compile/
        shell: bash
        run: |
          mkdir cli-binaries
          for pair in x86_64-unknown-linux-gnu:linux-x86_64 aarch64-unknown-linux-gnu:linux-arm64 \
            x86_64-apple-darwin:macos-x86_64 aarch64-apple-darwin:macos-arm64 \
            x86_64-pc-windows-msvc:windows-x86_64.exe; do
            (cd cli && deno compile --no-check --engine quickjs --config deno.jsonc -P=runtime --include skills \
              --target "${pair%%:*}" --output "../cli-binaries/${CLI_ASSET_PREFIX}-${pair#*:}" dist/astralbeam.js)
          done
          binary="cli-binaries/${CLI_ASSET_PREFIX}-linux-x86_64"
          test "$("$binary" --version)" = "${{ needs.verify.outputs.version }}"
          "$binary" skill | grep -q '^name: astralbeam$'

      - name: Upload the CLI binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries
          path: cli-binaries
          if-no-files-found: error

      - name: Upload the CLI package output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-dist
          path: cli/dist
          if-no-files-found: error

      - name: Upload the Webapp binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webapp-binaries
          path: platform-binaries
          if-no-files-found: error

      - name: Upload the SDK package output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-dist
          path: sdk/dist
          if-no-files-found: error

  github-release:
    name: Create the GitHub release
    # Runs after staging so a failed npm step does not leave a release pointing at unstaged packages.
    needs: [verify, build, stage-npm]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the Webapp binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webapp-binaries

      - name: Download the CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLATFORM_ASSET_PREFIX: astralbeam-platform-v${{ needs.verify.outputs.version }}
          CLI_ASSET_PREFIX: astralbeam-v${{ needs.verify.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "$PLATFORM_ASSET_PREFIX"-* "$CLI_ASSET_PREFIX"-*

  stage-npm:
    name: Stage the SDK and CLI on npm
    needs: [verify, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Trusted publishing exchanges this OIDC token for a short-lived npm credential. https://docs.npmjs.com/trusted-publishers
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the SDK package output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-dist
          path: sdk/dist

      - name: Download the CLI package output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-dist
          path: cli/dist

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Staged publishing needs Node 22.14.0 or higher and npm 11.15.0 or later. https://docs.npmjs.com/staged-publishing
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        # Node 24 patches bundle npm 11.13.0 through 11.19.0, and 11.13.0 is below the 11.15.0
        # floor the `stage` subcommands need, so pin an exact npm into this OIDC-credentialed job.
        run: npm install --global npm@11.19.0

      - name: Smoke-test the CLI package on Node
        working-directory: cli
        run: test "$(node dist/astralbeam.js --version)" = "${{ needs.verify.outputs.version }}"

      - name: Stage the SDK and CLI
        # Staging never makes a package public, so no token or 2FA is needed here. A maintainer
        # approves each with 2FA afterwards. https://docs.npmjs.com/cli/v11/commands/npm-stage
        shell: bash
        run: |
          set -o pipefail
          for project in sdk cli; do
            (cd "$project" && npm stage publish) | tee -a "$RUNNER_TEMP/npm-stage.log"
          done

      - name: Report the staged packages
        run: |
          {
            echo "## SDK and CLI staged on npm"
            echo
            echo "Approve each with \`npm stage approve <stage-id>\` or from the Staged Packages tab of [@astralbeam/sdk](https://www.npmjs.com/package/@astralbeam/sdk) and [@astralbeam/cli](https://www.npmjs.com/package/@astralbeam/cli). Approval prompts for 2FA."
            echo
            echo '```'
            cat "$RUNNER_TEMP/npm-stage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

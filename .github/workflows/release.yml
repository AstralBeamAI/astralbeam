name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify everything without publishing images, creating the release, or staging npm packages
        type: boolean
        default: true
      minimal:
        description: Skip verification, source maps, smoke tests, and Intel macOS and Windows binaries, and stage the SDK and release in one job. Ignores dry-run.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize publishing and cleanup across releases from different refs.
  group: ${{ github.workflow }}

jobs:
  verify:
    name: Verify version
    if: ${{ !inputs.minimal }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the tag matches the SDK and Platform versions
        id: version
        # `sdk` and `platform` are the versioned projects and move in lockstep: examples/todos
        # declares no version and website is a private placeholder at 0.0.0.
        run: |
          version="$(jq -r .version sdk/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .version platform/package.json)" != "$version" ]; then
            echo "::error::platform/package.json must match sdk/package.json version ${version}"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match sdk/package.json version ${version}"
            exit 1
          fi

      - name: Verify publishing target
        if: ${{ !inputs.dry-run }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag="refs/tags/v$RELEASE_VERSION"
          if git show-ref --verify --quiet "$tag"; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::v$RELEASE_VERSION already points to a different commit. Choose a new version or run Release from that tag."
              exit 1
            fi
            exit 0
          fi
          # GITHUB_TOKEN cannot publish workflow changes. https://docs.github.com/en/rest/releases/releases#create-a-release
          changes="$(git diff --name-only --no-renames --diff-filter=AM "origin/$DEFAULT_BRANCH" "$GITHUB_SHA" -- .github/workflows)"
          if [ -n "$changes" ]; then
            echo "::error::GITHUB_TOKEN cannot release this commit because it changes .github/workflows relative to $DEFAULT_BRANCH. Merge those workflow changes into $DEFAULT_BRANCH before publishing."
            exit 1
          fi

  build:
    name: Build release artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Version-free names let `releases/latest/download/<asset>` always serve the newest binary.
      # https://docs.github.com/repositories/releasing-projects-on-github/linking-to-releases
      PLATFORM_ASSET_PREFIX: astralbeam-platform
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies for every release target
        # Include native Sharp packages for the cross-compiled executables.
        # https://bun.sh/docs/pm/cli/install#platform-specific-dependencies
        run: bun install --frozen-lockfile --os=linux --os=darwin --os=win32 --cpu=x64 --cpu=arm64 --libc=glibc

      - name: Build the SDK
        working-directory: sdk
        run: bun run build

      - name: Build the Platform
        # Builds `.output` once and compiles the host binary from it.
        working-directory: platform
        run: bun run build

      - name: Upload the Platform source maps to PostHog
        if: ${{ !inputs.dry-run && vars.POSTHOG_PROJECT_ID != '' }}
        working-directory: platform
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_HOST || 'https://us.posthog.com' }}
        run: bun run sourcemaps:posthog --directory .output/sourcemaps

      - name: Smoke-test the Platform binary
        working-directory: platform
        run: bun run binary:check

      - name: Cross-compile the other Platform binaries
        working-directory: platform
        shell: bash
        run: |
          mkdir ../platform-binaries
          mv .output/astralbeam-platform "../platform-binaries/${PLATFORM_ASSET_PREFIX}-linux-x86_64"
          for pair in bun-linux-arm64:linux-arm64 bun-darwin-x64:macos-x86_64 \
            bun-darwin-arm64:macos-arm64 bun-windows-x64:windows-x86_64.exe; do
            bun run compile --target "${pair%%:*}" \
              --outfile "../platform-binaries/${PLATFORM_ASSET_PREFIX}-${pair#*:}"
          done

      - name: Pack the SDK without publishing credentials
        run: |
          mkdir npm-packages
          bun pm --cwd sdk pack --filename "$GITHUB_WORKSPACE/npm-packages/sdk.tgz"

      - name: Upload the SDK package output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error

      - name: Upload the Platform binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-binaries
          path: platform-binaries
          if-no-files-found: error

  github-release:
    name: Create the GitHub release
    # Runs after staging so a failed npm step does not leave a release pointing at unstaged packages.
    needs: [verify, build, stage-npm, docker-image, sandbox-image, docker-cleanup]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the Platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-binaries

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          sha256sum astralbeam-* > SHA256SUMS
          tag="v$RELEASE_VERSION"
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')"
          if ! grep -Fxq "refs/tags/$tag" <<< "$refs"; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          tag_sha="$(gh api "repos/$GH_REPO/commits/refs/tags/$tag" --jq .sha)"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$tag now points to a different commit. Refusing to release artifacts from $GITHUB_SHA."
            exit 1
          fi
          gh release create "$tag" --verify-tag --latest --generate-notes astralbeam-* SHA256SUMS

  docker-image:
    name: Build and publish the Docker image
    needs: [verify, build, stage-npm]
    if: ${{ !cancelled() && needs.build.result == 'success' && (inputs.dry-run || needs.stage-npm.result == 'success') }}
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ !inputs.dry-run }}
      file: platform/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      build-args: SOURCE_VERSION=${{ github.sha }}
      meta-images: ghcr.io/astralbeamai/astralbeam-platform
      meta-tags: type=raw,value=${{ needs.verify.outputs.version }}
      set-meta-labels: true
      set-meta-annotations: true
      meta-labels: |
        org.opencontainers.image.title=AstralBeam Platform
        org.opencontainers.image.description=Self-hosted AstralBeam Platform for building and running AI agents
        org.opencontainers.image.url=https://astralbeam.ai
        org.opencontainers.image.licenses=AGPL-3.0-only
      meta-annotations: |
        org.opencontainers.image.title=AstralBeam Platform
        org.opencontainers.image.description=Self-hosted AstralBeam Platform for building and running AI agents
        org.opencontainers.image.url=https://astralbeam.ai
        org.opencontainers.image.licenses=AGPL-3.0-only
      sbom: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  sandbox-image:
    name: Build and publish the sandbox image
    needs: [verify, build, stage-npm]
    if: ${{ !cancelled() && needs.build.result == 'success' && (inputs.dry-run || needs.stage-npm.result == 'success') }}
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ !inputs.dry-run }}
      context: platform/packages/sandbox/image
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/astralbeamai/sandbox
      meta-tags: |
        type=raw,value=${{ needs.verify.outputs.version }}
        type=raw,value=latest
      set-meta-labels: true
      set-meta-annotations: true
      meta-labels: |
        org.opencontainers.image.title=AstralBeam Sandbox
        org.opencontainers.image.description=General-purpose execution environment for AI agents
        org.opencontainers.image.url=https://astralbeam.ai
        org.opencontainers.image.licenses=AGPL-3.0-only
      meta-annotations: |
        org.opencontainers.image.title=AstralBeam Sandbox
        org.opencontainers.image.description=General-purpose execution environment for AI agents
        org.opencontainers.image.url=https://astralbeam.ai
        org.opencontainers.image.licenses=AGPL-3.0-only
      sbom: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  docker-cleanup:
    name: Remove redundant Docker build indexes (${{ matrix.package }})
    needs: [docker-image, sandbox-image]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: astralbeam-platform, job: docker-image }
          - { package: sandbox, job: sandbox-image }
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/astralbeamai/${{ matrix.package }}
      IMAGE_DIGEST: ${{ needs[matrix.job].outputs.digest }}
      VERIFY_COMMANDS: ${{ needs[matrix.job].outputs.cosign-verify-commands }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the builder's Cosign version
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ needs[matrix.job].outputs.cosign-version }}

      - name: Verify signatures before cleanup
        env:
          IMAGE_SIGNED: ${{ needs[matrix.job].outputs.signed }}
        # Use the verification commands emitted by the pinned Docker builder.
        # https://github.com/docker/github-builder/blob/4345a1cea1e4cfb65c8a5e2b1b80f9e630068827/.github/workflows/build.yml#L181
        run: |
          test "$IMAGE_SIGNED" = true
          test -n "$VERIFY_COMMANDS"
          bash -euo pipefail -c "$VERIFY_COMMANDS"

      - name: Remove unreferenced build indexes
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          package: ${{ matrix.package }}
          delete-untagged: true
          validate: true

      - name: Verify both architectures and signatures after cleanup
        shell: bash
        # The cleanup action's validation only warns, so make missing manifests or signatures fatal.
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST" \
            --format '{{json .Image}}' | jq -e 'keys == ["linux/amd64", "linux/arm64"]'
          bash -euo pipefail -c "$VERIFY_COMMANDS"

  stage-npm:
    name: Stage the SDK on npm
    needs: [verify, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Trusted publishing exchanges this OIDC token for a short-lived npm credential. https://docs.npmjs.com/trusted-publishers
      id-token: write
    steps:
      - name: Download the npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: npm-packages

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Stage the SDK
        # Staging never makes a package public, so no token or 2FA is needed here. A maintainer
        # approves it with 2FA afterwards. https://docs.npmjs.com/cli/v11/commands/npm-stage
        shell: bash
        run: |
          set -o pipefail
          npm stage publish --ignore-scripts ./npm-packages/sdk.tgz | tee -a "$RUNNER_TEMP/npm-stage.log"

      - name: Report the staged package
        run: |
          {
            echo "## SDK staged on npm"
            echo
            echo "Approve it with \`npm stage approve <stage-id>\` or from the Staged Packages tab of [@astralbeam/sdk](https://www.npmjs.com/package/@astralbeam/sdk). Approval prompts for 2FA."
            echo
            echo '```'
            cat "$RUNNER_TEMP/npm-stage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  minimal-release:
    name: Stage the SDK and release the Platform binaries (minimal)
    if: ${{ inputs.minimal }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One job skips artifact transfers, so build code shares the npm and release credentials.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-minimal-release-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}

      - name: Install dependencies for the Linux and Apple Silicon targets
        run: bun install --frozen-lockfile --os=linux --os=darwin --cpu=x64 --cpu=arm64 --libc=glibc

      - name: Build the SDK
        # Skips the build task's `pack --dry-run`, since the next step packs it for real.
        run: |
          bun run --cwd sdk generate:styles
          bun run --cwd sdk tsdown

      # Minimal releases ship no Intel macOS or Windows binaries. Full releases still build them.
      - name: Stage the SDK while building the Platform binaries
        shell: bash
        run: |
          set -o pipefail
          (bun pm --cwd sdk pack --filename "$RUNNER_TEMP/sdk.tgz" &&
            npm stage publish --ignore-scripts "$RUNNER_TEMP/sdk.tgz" | tee -a "$GITHUB_STEP_SUMMARY") \
            > "$RUNNER_TEMP/npm-stage.log" 2>&1 &
          stage=$!
          bun run --cwd platform build
          mkdir platform-binaries
          mv platform/.output/astralbeam-platform platform-binaries/astralbeam-platform-linux-x86_64
          for pair in bun-linux-arm64:linux-arm64 bun-darwin-arm64:macos-arm64; do
            bun run --cwd platform compile --target "${pair%%:*}" \
              --outfile "$GITHUB_WORKSPACE/platform-binaries/astralbeam-platform-${pair#*:}"
          done
          (cd platform-binaries && sha256sum astralbeam-* > SHA256SUMS)
          # Waits before releasing so a failed npm step does not leave a release pointing at unstaged packages.
          status=0
          wait "$stage" || status=$?
          cat "$RUNNER_TEMP/npm-stage.log"
          exit "$status"

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version platform/package.json)"
          cd platform-binaries
          gh release create "v$version" --target "$GITHUB_SHA" --latest --generate-notes astralbeam-* SHA256SUMS

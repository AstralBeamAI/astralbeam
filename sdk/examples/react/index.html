<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstralBeam React example</title>
    <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #fdf6e3;
    }
    /* Deliberately hostile global styles, as in the vanilla example: they cannot cross the
       widget's shadow boundary, not even with !important. */
    p {
      color: crimson;
      font-style: italic;
    }
    p::before {
      content: "🔥 ";
    }
    aside,
    header,
    .astralbeam-chat {
      background: #000 !important;
      color: #0f0 !important;
    }
    #root {
      display: grid;
      grid-template-columns: 1fr 360px;
      height: 100vh;
    }
    main {
      padding: 24px;
      max-width: 65ch;
    }
    .sidebar {
      height: 100vh;
    }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Codex desktop reads this file for Local and Worktree modes; cloud lifecycle settings remain in Codex Settings.
# https://learn.chatgpt.com/docs/environments/local-environment
version = 1
name = "AstralBeam"

[setup]
script = "bash scripts/setup.sh"

[[actions]]
name = "Product application"
icon = "run"
command = "cd webapp && deno task dev"

[[actions]]
name = "Public website"
icon = "run"
command = "cd www && deno task dev"

[[actions]]
name = "Ready"
icon = "tool"
command = "deno task --cwd webapp ready && deno task --cwd www ready"

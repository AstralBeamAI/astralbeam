# Codex desktop reads this file for Local and Worktree modes; cloud lifecycle settings remain in Codex Settings.
# https://learn.chatgpt.com/docs/environments/local-environment
version = 1
name = "AstralBeam"

[setup]
script = "bun install --frozen-lockfile && bash scripts/copy-worktree-env.sh && bash scripts/setup.sh"

[[actions]]
name = "Product application"
icon = "run"
command = "bun run --cwd platform dev"

[[actions]]
name = "Public website"
icon = "run"
command = "bun run --cwd website dev"

[[actions]]
name = "Ready"
icon = "tool"
command = "bun run --cwd sdk ready && bun run --cwd platform ready && bun run --cwd website ready && bun run --cwd examples/todos ready && bun run --cwd cli ready && bun run --cwd examples/linearity-react ready"

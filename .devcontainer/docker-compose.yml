services:
  astralbeam:
    # Paths are relative to the first Compose file in devcontainer.json
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspaces/astralbeam
      # Keep Linux-native dependencies and Deno's cache isolated from the macOS checkout. https://docs.deno.com/runtime/reference/deno_json/#node-modules-directory
      - webapp-node-modules:/workspaces/astralbeam/webapp/node_modules
      - www-node-modules:/workspaces/astralbeam/www/node_modules
      - deno-cache:/root/.cache/deno
      # Persist Cursor/VS Code server + extensions across rebuilds
      - ./tmp/.cursor-server:/root/.cursor-server:cached
      - ./tmp/.vscode-server:/root/.vscode-server:cached
      - "${HOME}/.cursor:/workspaces/astralbeam/tmp/.cursor:cached"
      - "${HOME}/.codex:/workspaces/astralbeam/tmp/.codex:cached"
      - "${HOME}/.claude:/workspaces/astralbeam/tmp/.claude:cached"
      - "${HOME}/.config/gh:/workspaces/astralbeam/tmp/.gh:cached"
    command: sleep infinity
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  webapp-node-modules:
  www-node-modules:
  deno-cache:

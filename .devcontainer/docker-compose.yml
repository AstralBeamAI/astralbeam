services:
  mailpit:
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_HOST_PORT:-8025}:8025"

  astralbeam:
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-development}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-development-only-storage-key}
    # Paths are relative to the first Compose file in devcontainer.json
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspaces/astralbeam
      # Keep Linux-native dependencies and Bun's cache isolated from the macOS checkout. https://bun.sh/docs/install/cache
      - root-node-modules:/workspaces/astralbeam/node_modules
      - platform-node-modules:/workspaces/astralbeam/platform/node_modules
      - website-node-modules:/workspaces/astralbeam/website/node_modules
      - sdk-node-modules:/workspaces/astralbeam/sdk/node_modules
      - cli-node-modules:/workspaces/astralbeam/cli/node_modules
      - linearity-node-modules:/workspaces/astralbeam/examples/linearity-react/node_modules
      - todos-node-modules:/workspaces/astralbeam/examples/todos/node_modules
      - bun-cache:/root/.bun/install/cache
      - file-storage:/root/.local/share/astralbeam/storage
      # Persist Cursor/VS Code server + extensions across rebuilds
      - ./tmp/.cursor-server:/root/.cursor-server:cached
      - ./tmp/.vscode-server:/root/.vscode-server:cached
      - "${HOME}/.cursor:/workspaces/astralbeam/tmp/.cursor:cached"
      - "${HOME}/.codex:/workspaces/astralbeam/tmp/.codex:cached"
      - "${HOME}/.claude:/workspaces/astralbeam/tmp/.claude:cached"
      - "${HOME}/.config/gh:/workspaces/astralbeam/tmp/.gh:cached"
    command: sleep infinity
    init: true
    depends_on:
      pgbouncer:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      rustfs:
        condition: service_healthy

volumes:
  root-node-modules:
  platform-node-modules:
  website-node-modules:
  sdk-node-modules:
  cli-node-modules:
  linearity-node-modules:
  todos-node-modules:
  bun-cache:
  file-storage:

services:
  astralbeam:
    # Paths are relative to the first Compose file in devcontainer.json
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspaces/astralbeam
      # Persist Cursor/VS Code server + extensions across rebuilds
      - ./tmp/.cursor-server:/root/.cursor-server:cached
      - ./tmp/.vscode-server:/root/.vscode-server:cached
      - "${HOME}/.cursor:/workspaces/astralbeam/tmp/.cursor:cached"
      - "${HOME}/.codex:/workspaces/astralbeam/tmp/.codex:cached"
      - "${HOME}/.claude:/workspaces/astralbeam/tmp/.claude:cached"
      - "${HOME}/.config/gh:/workspaces/astralbeam/tmp/.gh:cached"
    command: sleep infinity
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

# Host workflows load this automatically; explicit devcontainer files skip it: https://docs.docker.com/compose/how-tos/multiple-compose-files/merge/
# Loopback avoids publishing on every host interface: https://docs.docker.com/reference/compose-file/services/#ports

services:
  pgbouncer:
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-5432}:5432"
  valkey:
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
  mailpit:
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_HOST_PORT:-8025}:8025"

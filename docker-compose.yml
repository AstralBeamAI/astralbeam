x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-astralbeam}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astralbeam123}
  POSTGRES_DB: ${POSTGRES_DB:-astralbeam}

# Leave DB_NAME unset so the generated PgBouncer config accepts development and test database names: https://github.com/edoburu/docker-pgbouncer/blob/master/entrypoint.sh
x-pgbouncer-env: &pgbouncer-env
  DB_USER: ${POSTGRES_USER:-astralbeam}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-astralbeam123}
  DB_HOST: ${POSTGRES_HOST:-postgres}
  DB_PORT: ${POSTGRES_PORT:-5432}
  HEALTHCHECK_DB: ${POSTGRES_DB:-astralbeam}
  AUTH_TYPE: scram-sha-256
  POOL_MODE: transaction
  ADMIN_USERS: ${POSTGRES_USER:-astralbeam}

x-valkey-env: &valkey-env
  VALKEY_HOST: ${VALKEY_HOST:-valkey}
  VALKEY_PORT: ${VALKEY_PORT:-6379}

services:
  postgres:
    image: postgres:18.7@sha256:37586cb420551a1d64a424c5d02e93642692499f70919dda80e4bdafbb0a9533
    restart: unless-stopped
    environment:
      <<: *postgres-env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      start_period: 60s
      start_interval: 1s
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    restart: unless-stopped
    environment:
      <<: *pgbouncer-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      start_period: 60s
      start_interval: 1s
      test:
        - CMD-SHELL
        - PGPASSWORD="$${DB_PASSWORD}" psql --host 127.0.0.1 --username "$${DB_USER}" --dbname "$${HEALTHCHECK_DB}" --tuples-only --no-align --command "select 1" | grep -qx 1

  valkey:
    image: valkey/valkey:9.1.4@sha256:3ab0eca823ebbf0fe352476ebac330ac9e5f14b592b9a954eab296d341e81b0e
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    environment:
      <<: *valkey-env
    volumes:
      - valkey-data:/data
    healthcheck:
      start_period: 60s
      start_interval: 1s
      test: ["CMD", "valkey-cli", "ping"]

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - mailpit-data:/data
    healthcheck:
      start_period: 60s
      start_interval: 1s
      test: ["CMD", "/mailpit", "readyz"]

  rustfs:
    image: ghcr.io/mintuhouse/rustfs:minimal
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-development}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-development-only-storage-key}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-${APP_BASE_URL:-http://localhost:${PORT:-4500}}}
    volumes:
      - rustfs-data:/data
    healthcheck:
      start_period: 60s
      start_interval: 1s
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/health/ready"]

volumes:
  postgres-data:
  valkey-data:
  mailpit-data:
  rustfs-data:

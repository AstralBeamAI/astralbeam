name: astralbeam-self-hosted

services:
  platform:
    image: ghcr.io/astralbeamai/astralbeam-platform:${ASTRALBEAM_VERSION:-0.23.7}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${PORT:-4510}:${PORT:-4510}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-astralbeam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-astralbeam}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY}
      PORT: ${PORT:-4510}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${PORT:-4510}}
      ALLOW_INSECURE:
      STORAGE_PROVIDER: filesystem
      STORAGE_DIRECTORY: /var/lib/astralbeam/storage
    volumes:
      - file-storage:/var/lib/astralbeam/storage

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astralbeam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-astralbeam}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      start_period: 60s
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

volumes:
  postgres-data:
  file-storage:

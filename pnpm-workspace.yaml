packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: false
  sharp: true
  workerd: true

catalogMode: prefer

catalog:
  # Babel 8 changed the AST behavior React Compiler currently relies on; retain latest Babel 7.
  # https://babeljs.io/docs/v8-migration-api/#remove-assignmentpattern-and-restelement-from-the-lval-alias-17387
  "@babel/core": ^7
  "@base-ui/react": ^1.6.0
  "@better-auth-ui/core": ^1.6.45
  "@better-auth-ui/react": ^1.6.45
  "@better-auth/drizzle-adapter": 1.7.0-rc.5
  "@csstools/color-helpers": 6.1.0
  "@csstools/css-color-parser": 4.1.10
  "@csstools/css-parser-algorithms": 4.0.0
  "@csstools/css-tokenizer": 4.0.0
  "@fontsource-variable/inter": ^5.2.8
  "@fontsource-variable/manrope": ^5.2.8
  "@phosphor-icons/react": ^2.1.10
  "@rolldown/plugin-babel": ^0.2.3
  "@tailwindcss/vite": ^4
  "@tanstack/devtools-vite": ^0.8.3
  "@tanstack/react-devtools": ^0.10.9
  "@tanstack/react-pacer": ^0.23.0
  "@tanstack/react-query": 5.101.4
  "@tanstack/react-router": ^1.170.18
  "@tanstack/react-router-devtools": ^1.167.0
  "@tanstack/react-router-ssr-query": 1.167.1
  "@tanstack/react-start": ^1.168.32
  "@tanstack/router-cli": ^1.167.21
  "@types/babel__core": ^7
  "@types/node": ^22
  "@types/react": ^19
  "@types/react-dom": ^19
  "@vitejs/plugin-react": ^6
  babel-plugin-react-compiler: ^1
  better-auth: 1.7.0-rc.5
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-kit: ^1.0.0-rc.4
  drizzle-orm: ^1.0.0-rc.4
  effect: 4.0.0-rc.108
  knip: ^6.32.0
  nitro: 3.0.260610-beta
  postgres: ^3.4.9
  react: ^19.2.6
  react-dom: ^19.2.6
  shadcn: ^4.18.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4
  tw-animate-css: ^1.4.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vite-plus: 0.2.5
  wrangler: ^4.112.0

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - shadcn@4.18.0

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">A reply is just the beginning</title><desc id="desc">A chat request branches into a failed action and a recoverable path.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c3cec1"/></pattern></defs><path fill="#e8eee2" d="M0 0h1200v630H0z"/><path fill="url(#grid)" d="M590 0h610v630H590z"/><g fill="#264c3d"><text x="64" y="84" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">ASTRALBEAM / FIELD NOTES</text><text x="64" y="270" font-family="Georgia,serif" font-size="64" letter-spacing="-2">A reply is just</text><text x="64" y="344" font-family="Georgia,serif" font-size="64" letter-spacing="-2">the beginning.</text><text x="66" y="409" font-family="Arial,sans-serif" font-size="20" fill="#536653">10 small failures. 10 better patterns.</text></g><rect x="65" y="494" width="205" height="40" rx="20" fill="#d5e3d0"/><text x="88" y="520" fill="#264c3d" font-family="Arial,sans-serif" font-size="14">AN INTERACTIVE GUIDE</text><g stroke="#9caf9d" stroke-width="2" fill="none"><path d="M843 201v69H731v75m112-75h176v150"/><circle cx="843" cy="270" r="5" fill="#e8eee2"/></g><rect x="647" y="81" width="432" height="120" rx="12" fill="#fffef9" stroke="#c8d4c2"/><circle cx="682" cy="115" r="10" fill="#d6e5cf"/><g font-family="Arial,sans-serif"><text x="705" y="121" font-size="15" fill="#536653">You</text><text x="673" y="161" font-size="22" fill="#264c3d">“Create a task for the launch.”</text></g><rect x="597" y="345" width="278" height="142" rx="12" fill="#faf0e9" stroke="#d5a996"/><g font-family="Arial,sans-serif"><text x="621" y="382" font-size="13" letter-spacing="1" fill="#9a5140">RETRY / REPEAT</text><text x="621" y="422" font-size="23" fill="#713e32">2 tasks created.</text><text x="621" y="456" font-size="16" fill="#9a5140">One request. Twice the work.</text></g><rect x="901" y="420" width="251" height="142" rx="12" fill="#f6faf2" stroke="#8eac88"/><g font-family="Arial,sans-serif"><text x="925" y="456" font-size="13" letter-spacing="1" fill="#456a40">RETRY / RECONCILE</text><text x="925" y="496" font-size="23" fill="#264c3d">1 task. Confirmed.</text><text x="925" y="531" font-size="16" fill="#536653">Same action. Same result.</text></g></svg>
